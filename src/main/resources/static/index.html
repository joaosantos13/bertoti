<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <section id="tela-inicial" class="tela ativa">
            <h1>Bem-vindo à Loja de Produtos</h1>

            <p class="subtitulo">
                Escolha uma das opções abaixo.
            </p>

            <div class="botoes-iniciais">
                <button class="btn-principal" onclick="mostrarTela('comprar-produtos')">
                    Comprar Produtos
                </button>

                <button class="btn-secundario" onclick="mostrarTela('adicionar-produtos')">
                    Adicionar Produtos
                </button>
            </div>
        </section>

        <section id="comprar-produtos" class="tela">
            <div class="topo-tela">
                <h1>Comprar Produtos</h1>

                <div class="grupo-botoes-topo">
                    <button class="btn-voltar" onclick="mostrarTela('tela-inicial')">
                        Voltar
                    </button>

                    <button class="btn-secundario" onclick="mostrarTela('adicionar-produtos')">
                        Adicionar Produtos
                    </button>
                </div>
            </div>

            <div id="lista-produtos" class="grid-produtos">
                <p>Carregando produtos...</p>
            </div>
        </section>

        <section id="adicionar-produtos" class="tela">
            <div class="topo-tela">
                <h1>Adicionar Produtos</h1>

                <div class="grupo-botoes-topo">
                    <button class="btn-voltar" onclick="mostrarTela('tela-inicial')">
                        Voltar
                    </button>

                    <button class="btn-principal" onclick="mostrarTela('comprar-produtos')">
                        Comprar Produtos
                    </button>
                </div>
            </div>

            <div class="form-container">
                <form id="form-produto">

                    <input type="text" id="nome" placeholder="Nome do Produto" required>

                    <input
                        type="number"
                        id="preco"
                        placeholder="Preço"
                        step="0.01"
                        required
                    >

                    <input
                        type="number"
                        id="estoque"
                        placeholder="Quantidade em estoque"
                        min="1"
                        required
                    >

                    <button type="submit" class="btn-principal">
                        Adicionar Produto
                    </button>

                </form>
            </div>
        </section>

    </div>

    <script src="app.js"></script>
</body>
</html>
